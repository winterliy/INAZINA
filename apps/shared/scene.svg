<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" preserveAspectRatio="xMidYMid slice" role="presentation" focusable="false">
<style>
.sc-bg{fill:url(#scbg)}
.sc-ltr{fill:#141414;opacity:0;transform-box:fill-box;transform-origin:50% 100%;animation:sc-rise 1.1s cubic-bezier(.2,.8,.2,1) forwards}
.sc-dot{fill:#1f3fff;transform-box:fill-box;transform-origin:50% 50%;opacity:0;animation:sc-drop 1.3s cubic-bezier(.3,1.5,.5,1) forwards}
.sc-dot.d1{animation-delay:.95s}.sc-dot.d2{animation-delay:1.1s}.sc-dot.d3{animation-delay:1.3s}
.sc-ring{fill:none;stroke:#1f3fff;stroke-width:5;opacity:0;transform-box:fill-box;transform-origin:50% 50%;animation:sc-ripple 4.2s ease-out infinite}
.sc-ring.r2{animation-delay:1.4s}.sc-ring.r3{animation-delay:2.8s}
.sc-float{fill:#1f3fff;opacity:0;animation:sc-float 11s linear infinite}
.sc-word{animation:sc-breathe 7s ease-in-out 2.4s infinite}
.sc-sheen{fill:url(#scsheen);mix-blend-mode:soft-light;animation:sc-sheen 7s ease-in-out 2.4s infinite}
@keyframes sc-rise{0%{opacity:0;transform:translateY(120px) scaleY(1.2)}100%{opacity:1;transform:none}}
@keyframes sc-drop{0%{opacity:0;transform:translateY(-260px) scale(.4)}60%{opacity:1}100%{opacity:1;transform:none}}
@keyframes sc-ripple{0%{opacity:.45;transform:scale(.2)}100%{opacity:0;transform:scale(8)}}
@keyframes sc-float{0%{opacity:0;transform:translateY(0)}12%{opacity:.5}88%{opacity:.5}100%{opacity:0;transform:translateY(-520px)}}
@keyframes sc-breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes sc-sheen{0%,100%{opacity:0}50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){.sc-ltr,.sc-dot,.sc-ring,.sc-float,.sc-word,.sc-sheen{animation:none!important;opacity:1}.sc-ring,.sc-float,.sc-sheen{opacity:0}}
</style>
<defs>
<linearGradient id="scbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8ecf6"/><stop offset=".55" stop-color="#d8dff0"/><stop offset="1" stop-color="#c7d1ea"/></linearGradient>
<radialGradient id="scsheen" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
</defs>
