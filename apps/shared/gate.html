<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<title>{{TITLE}} · inazina</title>
{{ICON}}
<style>
:root{color-scheme:light;--ink:#141414;--ink2:#6c6c68;--line:#dcdcd7;--field:#f1f1ef;--accent:#1f3fff;--bg:#f3f3f1;--panel:#ffffff;--ok:#2fa95a;--bad:#d93025;--font:"DM Sans","Noto Sans KR",-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;--mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--ink:#ecece8;--ink2:#9a9c95;--line:#34382f;--field:#262922;--accent:#7b8dff;--bg:#121411;--panel:#1b1d19}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;grid-template-columns:minmax(0,3.5fr) minmax(400px,1fr);padding:16px;color:var(--ink);background:var(--bg);font:400 15px/1.55 var(--font)}
.visual{position:relative;border-radius:20px;overflow:hidden;min-height:calc(100vh - 32px)}
.visual svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.panel{display:flex;flex-direction:column;min-width:0;margin-left:16px;padding:32px clamp(24px,2.4vw,44px) 24px;background:var(--panel);border-radius:20px}
.brand{display:inline-flex;align-items:center;gap:14px;color:var(--ink);text-decoration:none}
.logo{height:30px;width:auto;display:block}
.tag{padding:2px 9px;border-radius:99px;color:var(--ink2);background:var(--field);font:500 11px/1.6 var(--mono)}
.body{width:min(100%,440px);margin:auto;padding:48px 0 24px}
h1{margin:0 0 10px;font-size:26px;line-height:1.2;font-weight:500;letter-spacing:-.02em}
.lead{margin:0 0 26px;color:var(--ink2);font-size:14px;line-height:1.55}
.chip{display:inline-block;margin:0 0 18px;padding:5px 12px;border-radius:99px;background:var(--field);font:400 12px var(--mono);color:var(--ink2);word-break:break-all}
form{display:grid;gap:18px}
label{display:grid;gap:8px;font-size:12.5px;font-weight:500}
label span{padding-left:2px}
input{width:100%;min-height:46px;padding:0 14px;border:1px solid transparent;border-radius:6px;color:var(--ink);background:var(--field);font:inherit;font-size:15px}
input::placeholder{color:var(--ink2);opacity:.8}
input:focus{outline:0;border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.secret{position:relative;display:block}.secret input{padding-right:46px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:38px;height:38px;border:0;border-radius:6px;color:var(--ink2);background:transparent;cursor:pointer}
.eye:hover{color:var(--ink)}
button.go{min-height:46px;margin-top:4px;border:0;border-radius:6px;color:#fff;background:var(--accent);font:inherit;font-size:15px;font-weight:600;cursor:pointer}
button.go:disabled{opacity:.6;cursor:progress}
.err{margin:16px 0 0;padding:11px 14px;border-radius:6px;color:#8a2a20;background:#f6d4d0;font-size:13.5px}
.err:empty{display:none}
pre{max-height:40vh;overflow:auto;margin:16px 0 0;padding:14px;border-radius:6px;background:var(--field);font:12.5px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word}
.divider{height:1px;margin:28px 0 20px;background:var(--line)}
.links{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;font-size:13px}
.links a{color:var(--accent);text-decoration:none}.links a:hover{text-decoration:underline;text-underline-offset:3px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--ink2);font-size:12px}
.status{display:inline-flex;align-items:center;gap:8px}.status i{width:8px;height:8px;border-radius:50%;background:var(--bad)}.status.ok i{background:var(--ok)}
[hidden]{display:none!important}
@media (max-width:900px){body{grid-template-columns:1fr;padding:0}.visual{display:none}.panel{margin:0;border-radius:0;padding:24px 22px 20px;min-height:100vh}.body{padding-top:36px}}
</style>
</head>

<div class="body">
<h1>{{HEADING}}</h1>
<p class="lead">{{LEAD}}</p>
{{PATH_CHIP}}
<form id="gate" autocomplete="off">
<label><span>아이디</span><input name="loginId" autocomplete="username" placeholder="아이디"></label>
<label><span>비밀번호</span><span class="secret"><input id="pw" name="password" type="password" autocomplete="current-password" placeholder="비밀번호" required>
<button type="button" class="eye" id="eye" aria-label="비밀번호 보기" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg></button></span></label>
<button class="go" type="submit" id="go">로그인</button>
</form>
<p class="err" id="err" role="alert"></p>
<pre id="out" hidden></pre>
<div class="divider"></div>
<nav class="links" aria-label="이동">{{LINKS}}</nav>
</div>
<footer class="foot"><span class="status {{STATUS_CLASS}}"><i></i>{{STATUS_TEXT}}</span><span>© INAZINA</span></footer>
</main>
<script>
(function(){
  var form=document.getElementById("gate"),err=document.getElementById("err"),out=document.getElementById("out"),go=document.getElementById("go"),pw=document.getElementById("pw"),eye=document.getElementById("eye");
  var target="{{TARGET_JS}}";
  eye.addEventListener("click",function(){var s=pw.type==="password";pw.type=s?"text":"password";eye.setAttribute("aria-pressed",String(s));eye.setAttribute("aria-label",s?"비밀번호 숨기기":"비밀번호 보기")});
  form.addEventListener("submit",function(e){
    e.preventDefault();err.textContent="";out.hidden=true;go.disabled=true;
    var body=new URLSearchParams({target:target,password:pw.value,loginId:form.elements.loginId.value.trim()});
    fetch("/__browser-access",{method:"POST",headers:{"content-type":"application/x-www-form-urlencoded"},body:body,redirect:"manual",cache:"no-store"}).then(function(r){
      if(r.type==="opaqueredirect"||r.status===0||(r.status>=300&&r.status<400)||r.status===401||r.status===403||r.status===429){err.textContent=r.status===429?"시도가 너무 많습니다. 잠시 뒤에 다시 시도해주세요.":"아이디 또는 비밀번호가 맞지 않거나 관리자 계정이 아닙니다.";return}
      return r.text().then(function(t){var s;try{s=JSON.stringify(JSON.parse(t),null,2)}catch(x){err.textContent="결과를 읽지 못했습니다.";return}
        out.textContent=s;out.hidden=false;pw.value=""})
    }).catch(function(){err.textContent="서버에 연결하지 못했습니다."}).then(function(){go.disabled=false});
  });
})();
</script>
