[pytest]
testpaths = tests
# Matches `unittest discover -s tests`: modules import siblings such as test_inazina.
pythonpath = . tests
python_files = test_*.py
addopts = -ra --strict-markers
# Tests open many short-lived SQLite connections; keep their ResourceWarnings
# visible in the summary without failing the run.
filterwarnings =
    default::ResourceWarning
